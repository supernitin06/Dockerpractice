<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="root">
        <div style="margin-bottom: 20px;" id="heading">
            Hello Fill The Form Please
        </div>
        <form id="contactform" style="display: flex; flex-direction: column; width: 400px; row-gap: 10px;">
            <label style="background-color: aqua; padding: 4px;" for="nameinput">Write Your Name</label>
            <input id="nameinput" type="text" required placeholder="Name" />
            <label style="background-color: aqua; padding: 4px;" for="emailinput">Write Your email</label>
            <input id="emailinput" type="email" required placeholder="Name" />
            <button id="submit" style="background-color: blue; width: 70px; padding: 5px; color: aliceblue; ">Submit
            </button>
        </form>
        <div id="Formoutput" style="margin-top: 5px;">
            
            Hello World

        </div>
    </div>
    <script src="script.js"> </script>

</body>

</html>
