<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Information Directory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Animated background blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div id="root">
        <!-- Card 1: Form Card -->
        <div class="card form-card">
            <!-- Header -->
            <div class="card-header">
                <div class="icon-wrap">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
                <h1 id="heading">Get In Touch</h1>
                <p class="subtitle">Fill in your details to record your information</p>
            </div>

            <!-- Form -->
            <form id="contactform">
                <div class="field-group">
                    <label for="nameinput">Your Name</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <input id="nameinput" type="text" required placeholder="John Doe" autocomplete="name" />
                    </div>
                </div>

                <div class="field-group">
                    <label for="emailinput">Email Address</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2" />
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                        </svg>
                        <input id="emailinput" type="email" required placeholder="john@example.com" autocomplete="email" />
                    </div>
                </div>

                <button id="submit" type="submit">
                    <span class="btn-text">Submit Data</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </form>

            <!-- Output -->
            <div id="Formoutput"></div>
        </div>

        <!-- Card 2: Table Records Directory -->
        <div class="card table-card">
            <div class="card-header table-card-header">
                <div class="header-left">
                    <div class="table-icon-wrap">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="table-title">Stored Records</h2>
                        <p class="subtitle">Live database entries</p>
                    </div>
                </div>

                <button id="getdata" class="secondary-btn" type="button" title="Fetch records from server">
                    <svg class="refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19" />
                    </svg>
                    <span class="btn-text">Fetch Records</span>
                </button>
            </div>

            <div class="table-container">
                <table id="tabledata">
                    <thead>
                        <tr>
                            <th>User Name</th>
                            <th>Email Address</th>
                        </tr>
                    </thead>
                    <tbody id="tablebody">
                        <tr class="empty-row">
                            <td colspan="2">
                                <div class="empty-state">
                                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <ellipse cx="12" cy="5" rx="9" ry="3"/>
                                        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                                    </svg>
                                    <p>No records loaded yet</p>
                                    <span>Click "Fetch Records" to view stored entries</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="table-footer">
                <span id="recordCount" class="record-badge">0 records</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
